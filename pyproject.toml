[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-rr-tool"
version = "0.1.0"
description = "Desktop ECG R-peak and RR engineering analysis tool scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.5",
    "scipy==1.17.1",
    "wfdb==4.3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ecg-rr = "ecg_rr_tool.cli:main"
ecg-rr-gui = "ecg_rr_tool.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ecg_rr_tool*"]
